<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Moment</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px;
    }

    .logo {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: #64748b;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 8px 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 22px;
    }

    .camera-box {
      position: relative;
      overflow: hidden;
      background: #111827;
      border-radius: 22px;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cermin (mirror) hanya untuk kamera depan. Kamera belakang kekal normal. */
    #video.mirrored {
      transform: scaleX(-1);
    }

    #preview {
      display: none;
    }

    #cameraMessage {
      position: absolute;
      color: white;
      padding: 22px;
      text-align: center;
      line-height: 1.5;
    }

    
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 18px 0;
  padding: 0 12px;
}

.icon-button {
  width: 56px;
  height: 56px;
  padding: 0;
  flex: 0 0 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: #1e3a8a;
  border-radius: 50%;
}

.icon-button svg {
  width: 27px;
  height: 27px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.capture {
  width: 70px;
  height: 70px;
  flex: 0 0 70px;
  border: 5px solid white;
  border-radius: 50%;
  background: #1e3a8a;
  box-shadow: 0 0 0 2px #1e3a8a;
  padding: 0;
}


    button {
      border: 0;
      border-radius: 15px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1e3a8a;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #e5e7eb;
      color: #172033;
    }

    textarea {
      width: 100%;
      min-height: 82px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 13px;
      font: inherit;
      margin-bottom: 14px;
    }

    #commentSection, #retakeButton {
      display: none;
    }

    #status {
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
      margin-top: 14px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }


    /* Filter Gallery: ditambah secara berasingan supaya layout asal kekal. */
    .filter-panel { margin: 14px 0 8px; }
    .filter-heading { font-size: 13px; font-weight: 700; color: #64748b; margin: 0 0 9px; }
    .filter-list { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
    .filter-option { flex: 0 0 76px; border: 2px solid transparent; border-radius: 13px; background: #fff; padding: 5px; color: #334155; font-size: 11px; font-weight: 600; text-align: center; }
    .filter-option.active { border-color: #1e3a8a; background: #eff6ff; }
    .filter-thumb { height: 55px; border-radius: 8px; margin-bottom: 5px; background: linear-gradient(135deg,#f7c873,#df6b5b 48%,#167d88); position: relative; overflow: hidden; }
    .filter-thumb::after { content: ''; position: absolute; inset: 0; background: var(--thumb-filter, transparent); }
    .filter-option[data-filter="original"] .filter-thumb { background: linear-gradient(135deg,#d7e3e8,#f5d8bc 50%,#3b6a76); }
    .filter-option[data-filter="clarendon"] .filter-thumb { filter: contrast(1.3) saturate(1.3); }
    .filter-option[data-filter="gingham"] .filter-thumb { filter: sepia(.12) brightness(1.08) saturate(.75); }
    .filter-option[data-filter="juno"] .filter-thumb { filter: saturate(1.35) sepia(.1); }
    .filter-option[data-filter="lark"] .filter-thumb { filter: brightness(1.12) saturate(.82); }
    .filter-option[data-filter="ludwig"] .filter-thumb { filter: sepia(.16) saturate(.9); }
    .filter-option[data-filter="valencia"] .filter-thumb { filter: sepia(.28) brightness(1.06); }
    .filter-option[data-filter="aden"] .filter-thumb { filter: sepia(.12) hue-rotate(10deg) saturate(.72) brightness(1.08); }
    .filter-option[data-filter="moon"] .filter-thumb { filter: grayscale(1) contrast(1.1); }
    .filter-option[data-filter="reyes"] .filter-thumb { filter: sepia(.22) brightness(1.1) saturate(.7); }
    .filter-option[data-filter="jakarta"] .filter-thumb { filter: sepia(.22) saturate(1.2) contrast(1.08); }
    .filter-option[data-filter="losangeles"] .filter-thumb { filter: sepia(.3) saturate(1.25) brightness(1.06); }
    .filter-option[data-filter="tokyo"] .filter-thumb { filter: hue-rotate(12deg) saturate(1.12) contrast(1.15); }
    .filter-option[data-filter="paris"] .filter-thumb { filter: brightness(1.12) saturate(.82) sepia(.08); }
    .filter-option[data-filter="seoul"] .filter-thumb { filter: brightness(1.12) saturate(.8) hue-rotate(8deg); }
    .filter-option[data-filter="bali"] .filter-thumb { filter: saturate(1.3) sepia(.16); }
    .filter-option[data-filter="aloha"] .filter-thumb { background: linear-gradient(135deg,#f7bf38,#ef705c 45%,#0e8990); }
    .filter-option[data-filter="sunset"] .filter-thumb { background: linear-gradient(135deg,#ffb23f,#f16a70 55%,#7255a5); }
    .filter-option[data-filter="bloom"] .filter-thumb { background: linear-gradient(135deg,#f9d34b,#e94d72 55%,#168b80); }
    .filter-option[data-filter="islandfilm"] .filter-thumb { filter: sepia(.2) contrast(.9) saturate(.8); }
    .aloha-overlay { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 2; font-size: clamp(23px, 7vw, 38px); }
    .aloha-overlay span { position: absolute; filter: drop-shadow(0 1px 1px #ffffffaa); }
    .aloha-overlay .f1 { top: 2px; left: 3px; }
    .aloha-overlay .f2 { top: 2px; right: 3px; transform: rotate(25deg); }
    .aloha-overlay .f3 { bottom: 2px; left: 3px; transform: rotate(-18deg); }
    .aloha-overlay .f4 { bottom: 2px; right: 3px; transform: rotate(18deg); }

  </style>
</head>

<body>
  <main class="app">
    <div class="logo">BANDANA CAM</div>

    <h1>Photo Moment 📸</h1>
    <p class="subtitle" id="welcome">Sediakan kamera anda.</p>

    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <img id="preview" alt="Gambar yang diambil">
    <div class="aloha-overlay" id="alohaOverlay" aria-hidden="true">
      <span class="f1">🌺</span><span class="f2">🌴</span>
      <span class="f3">🌴</span><span class="f4">🌺</span>
    </div>
      <div id="cameraMessage">
        Kamera akan ada kat sini.
      </div>
    </div>

    <section class="filter-panel" aria-label="Pilihan filter">
      <p class="filter-heading">PILIH FILTER · SWIPE</p>
      <div class="filter-list" id="filterList">
        <button type="button" class="filter-option active" data-filter="original" onclick="selectFilter('original', this)"><div class="filter-thumb"></div>Original</button>
        <button type="button" class="filter-option" data-filter="clarendon" onclick="selectFilter('clarendon', this)"><div class="filter-thumb"></div>Clarendon</button>
        <button type="button" class="filter-option" data-filter="gingham" onclick="selectFilter('gingham', this)"><div class="filter-thumb"></div>Gingham</button>
        <button type="button" class="filter-option" data-filter="juno" onclick="selectFilter('juno', this)"><div class="filter-thumb"></div>Juno</button>
        <button type="button" class="filter-option" data-filter="lark" onclick="selectFilter('lark', this)"><div class="filter-thumb"></div>Lark</button>
        <button type="button" class="filter-option" data-filter="ludwig" onclick="selectFilter('ludwig', this)"><div class="filter-thumb"></div>Ludwig</button>
        <button type="button" class="filter-option" data-filter="valencia" onclick="selectFilter('valencia', this)"><div class="filter-thumb"></div>Valencia</button>
        <button type="button" class="filter-option" data-filter="aden" onclick="selectFilter('aden', this)"><div class="filter-thumb"></div>Aden</button>
        <button type="button" class="filter-option" data-filter="moon" onclick="selectFilter('moon', this)"><div class="filter-thumb"></div>Moon</button>
        <button type="button" class="filter-option" data-filter="reyes" onclick="selectFilter('reyes', this)"><div class="filter-thumb"></div>Reyes</button>
        <button type="button" class="filter-option" data-filter="jakarta" onclick="selectFilter('jakarta', this)"><div class="filter-thumb"></div>Jakarta</button>
        <button type="button" class="filter-option" data-filter="losangeles" onclick="selectFilter('losangeles', this)"><div class="filter-thumb"></div>Los Angeles</button>
        <button type="button" class="filter-option" data-filter="tokyo" onclick="selectFilter('tokyo', this)"><div class="filter-thumb"></div>Tokyo</button>
        <button type="button" class="filter-option" data-filter="paris" onclick="selectFilter('paris', this)"><div class="filter-thumb"></div>Paris</button>
        <button type="button" class="filter-option" data-filter="seoul" onclick="selectFilter('seoul', this)"><div class="filter-thumb"></div>Seoul</button>
        <button type="button" class="filter-option" data-filter="bali" onclick="selectFilter('bali', this)"><div class="filter-thumb"></div>Bali</button>
        <button type="button" class="filter-option" data-filter="aloha" onclick="selectFilter('aloha', this)"><div class="filter-thumb"></div>🌺 Aloha</button>
        <button type="button" class="filter-option" data-filter="sunset" onclick="selectFilter('sunset', this)"><div class="filter-thumb"></div>Sunset Luau</button>
        <button type="button" class="filter-option" data-filter="bloom" onclick="selectFilter('bloom', this)"><div class="filter-thumb"></div>Tropical Bloom</button>
        <button type="button" class="filter-option" data-filter="islandfilm" onclick="selectFilter('islandfilm', this)"><div class="filter-thumb"></div>Island Film</button>
      </div>
    </section>

  
<div class="controls">
  <!-- Gallery: empat petak kecil -->
  <button id="galleryButton"
    class="icon-button"
    type="button"
    aria-label="Lihat Gallery"
    onclick="openGallery()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>

  <!-- Butang kamera utama -->
  <button id="captureButton"
    class="capture"
    type="button"
    aria-label="Ambil gambar"
    onclick="capturePhoto()">
  </button>

  <!-- Tukar kamera: simbol refresh -->
  <button id="switchCameraButton"
    class="icon-button"
    type="button"
    aria-label="Tukar kamera depan atau belakang"
    onclick="switchCamera()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 7v5h-5"/>
      <path d="M4 17v-5h5"/>
      <path d="M5.6 9A7 7 0 0 1 18 6.5L20 12"/>
      <path d="M18.4 15A7 7 0 0 1 6 17.5L4 12"/>
    </svg>
  </button>
</div>


    <button id="startButton" class="primary" onclick="startCamera()">
      Buka Kamera
    </button>
    
    
    <button id="retakeButton" class="secondary primary"
      onclick="retakePhoto()">
      Retake
    </button>

    <section id="commentSection">
      <p><strong>Komen la sikit..</strong></p>
      <textarea id="comment"
        maxlength="160"
        placeholder="Tulis sesuatu tentang gambar ini..."></textarea>

      <button id="sendButton" class="primary" onclick="sendPhoto()">
        ➤ Hantar 
      </button>
    </section>

    <p id="status" role="status">Tengah loading sat...</p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const senderName = (params.get('name') || '').trim();

    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const cameraMessage = document.getElementById('cameraMessage');
    const captureButton = document.getElementById('captureButton');
    const startButton = document.getElementById('startButton');
    const retakeButton = document.getElementById('retakeButton');
    const commentSection = document.getElementById('commentSection');
    const commentInput = document.getElementById('comment');
    const sendButton = document.getElementById('sendButton');
    const statusBox = document.getElementById('status');

    let stream = null;
    let photoData = null;
    let waitingForUpload = false;
    let currentCamera = 'environment';
    let isMirrored = false;

    // true  = gambar yang disimpan sama macam preview (cermin) untuk kamera depan
    // false = gambar yang disimpan tidak dicermin (macam kamera biasa)
    const MIRROR_SAVED_FRONT_PHOTO = true;

    document.getElementById('welcome').textContent =
      senderName ? 'Hai haii, ' + senderName + '!' :
      'Sila kembali dan letak nama duluu.';

    function setStatus(message) {
      statusBox.textContent = message;
    }


    // Filter settings: same effect is applied to preview and saved photo.
    let selectedFilter = 'original';
    const filterSettings = {
      original: 'none', clarendon: 'contrast(1.22) saturate(1.2)',
      gingham: 'brightness(1.06) sepia(.12) saturate(.82)',
      juno: 'saturate(1.28) sepia(.08)', lark: 'brightness(1.1) saturate(.84)',
      ludwig: 'sepia(.12) saturate(.94) contrast(1.04)',
      valencia: 'sepia(.24) brightness(1.05)', aden: 'sepia(.1) saturate(.75) brightness(1.08)',
      moon: 'grayscale(1) contrast(1.08)', reyes: 'sepia(.2) brightness(1.08) saturate(.72)',
      jakarta: 'sepia(.2) saturate(1.18) contrast(1.08)',
      losangeles: 'sepia(.28) saturate(1.2) brightness(1.05)',
      tokyo: 'hue-rotate(10deg) saturate(1.12) contrast(1.12)',
      paris: 'brightness(1.1) saturate(.84) sepia(.06)',
      seoul: 'brightness(1.1) saturate(.82) hue-rotate(7deg)',
      bali: 'saturate(1.28) sepia(.14)', aloha: 'saturate(1.25) sepia(.12) contrast(1.04)',
      sunset: 'sepia(.22) saturate(1.25) hue-rotate(-8deg) brightness(1.04)',
      bloom: 'saturate(1.35) contrast(1.04)', islandfilm: 'sepia(.18) contrast(.92) saturate(.82)'
    };

    function selectFilter(name, button) {
      selectedFilter = name;
      document.querySelectorAll('.filter-option').forEach(item => item.classList.remove('active'));
      if (button) button.classList.add('active');
      const effect = filterSettings[name] || 'none';
      video.style.filter = effect;
      const overlay = document.getElementById('alohaOverlay');
      overlay.style.display = ['aloha', 'bloom'].includes(name) ? 'block' : 'none';
      setStatus(name === 'aloha' || name === 'bloom' ? 'Filter tropika dipilih! 🌺' : 'Filter ' + name + ' dipilih.');
    }

    function drawTropicalBorder(ctx, width, height) {
      // Decorative hibiscus/palm-style corners are drawn into the actual saved image.
      const flower = (cx, cy, size, rotation) => {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(rotation);
        const colors = ['#ffcf45', '#ff6b62', '#f34f83', '#fff0c2', '#0f8c83'];
        for (let i = 0; i < 5; i++) {
          ctx.save(); ctx.rotate(i * Math.PI * 2 / 5);
          ctx.fillStyle = colors[i % colors.length];
          ctx.beginPath(); ctx.ellipse(0, -size * .48, size * .25, size * .48, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
        ctx.fillStyle = '#f6b629'; ctx.beginPath(); ctx.arc(0, 0, size * .17, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      };
      const leaf = (x, y, size, angle) => {
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
        ctx.fillStyle = '#167d65'; ctx.beginPath(); ctx.ellipse(0, 0, size * .22, size, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#b7d77a'; ctx.lineWidth = Math.max(1, size * .035); ctx.beginPath(); ctx.moveTo(0, size * .8); ctx.lineTo(0, -size * .8); ctx.stroke(); ctx.restore();
      };
      const size = Math.min(width, height) * .075;
      [[size*.8,size*.8,0.2],[width-size*.8,size*.8,-0.4],[size*.8,height-size*.8,-0.3],[width-size*.8,height-size*.8,0.5]].forEach(([x,y,a],i)=>{
        leaf(x + (i%2? -size*.35:size*.35), y, size*.8, a);
        flower(x, y, size, a);
      });
      // Slim warm tropical edge, kept away from the centre of the photo.
      ctx.strokeStyle = 'rgba(255, 207, 69, .88)'; ctx.lineWidth = Math.max(3, Math.min(width,height)*.008);
      ctx.strokeRect(ctx.lineWidth, ctx.lineWidth, width-ctx.lineWidth*2, height-ctx.lineWidth*2);
    }

    async function startCamera() {
      if (!senderName) {
        setStatus('Nama tidak ditemui. Sila buka semula melalui halaman utama.');
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setStatus('Kamera tidak disokong di sini. Buka pautan menggunakan pelayar yang terkini.');
        return;
      }

      startButton.disabled = true;
      setStatus('Tengah akses kamera jap...');

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
           facingMode: { ideal: currentCamera },
            width: { ideal: 1600 },
            height: { ideal: 1200 }
          }
        });

        video.srcObject = stream;
        await video.play();

        // Kesan kamera sebenar yang dibuka (bukan sekadar yang diminta).
        // Webcam laptop biasanya tiada facingMode, jadi dianggap kamera depan.
        const settings = stream.getVideoTracks()[0].getSettings();
        isMirrored = settings.facingMode
          ? settings.facingMode === 'user'
          : true;
        video.classList.toggle('mirrored', isMirrored);

        video.style.display = 'block';
        preview.style.display = 'none';
        cameraMessage.style.display = 'none';
        captureButton.style.display = 'block';
        startButton.style.display = 'none';
        document.getElementById('switchCameraButton').style.display = 'inline-block';

        setStatus('Kamera readyy. Tekan bulat tu untuk bergambar, senyumm.');
      } catch (error) {
        startButton.disabled = false;
        startButton.style.display = 'block';
        cameraMessage.style.display = 'block';

        if (error.name === 'NotAllowedError') {
          cameraMessage.textContent =
            'Kebenaran kamera tidak diberikan. Cuba cek permission dekat website setting.';
          setStatus('Sila bagi akses kamera jika pop-up kebenaran dipaparkan.');
        } else {
          cameraMessage.textContent =
            'Kamera takleh dibuka. Cuba tekan Buka Kamera.';
          setStatus('Ralat kamera: ' + error.name);
        }
      }
    }

    
async function switchCamera() {
  if (waitingForUpload || photoData) return;

  const nextCamera =
    currentCamera === 'environment' ? 'user' : 'environment';

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  currentCamera = nextCamera;

  await startCamera();
}

      
  function openGallery() {
   const galleryUrl =
    'https://script.google.com/macros/s/AKfycbxy88O1sg0RndiNZsyEmrQ-IFzeqljy98huI0R88eBd4CiOlVcqgSBGoaLiwM_Zp4fu/exec?page=gallery';

    window.open(galleryUrl, '_blank');
  }


    function capturePhoto() {
     if (!video.videoWidth || !stream) {
        setStatus('Tunggu sampai kamera ready.');
        return;
      }

      const canvas = document.createElement('canvas');
      const maxWidth = 1600;
      const scale = Math.min(1, maxWidth / video.videoWidth);

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const ctx = canvas.getContext('2d');

      // Lukis video + filter. Balikkan kiri-kanan hanya untuk kamera depan,
      // supaya gambar yang disimpan sama dengan preview.
      ctx.save();
      if (isMirrored && MIRROR_SAVED_FRONT_PHOTO) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.filter = filterSettings[selectedFilter] || 'none';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      // Border tropika dilukis selepas restore supaya tidak terbalik.
      if (['aloha', 'bloom'].includes(selectedFilter)) drawTropicalBorder(ctx, canvas.width, canvas.height);

      photoData = canvas.toDataURL('image/jpeg', 0.88);

      preview.src = photoData;
      preview.style.display = 'block';
      video.style.display = 'none';
      captureButton.style.display = 'none';
      retakeButton.style.display = 'block';
      commentSection.style.display = 'block';
      commentInput.value = '';

      setStatus('Gambar sudah diambil. Komen la sikett, kemudian hantar.');
    }

    function retakePhoto() {
      if (waitingForUpload) return;

      photoData = null;
      preview.style.display = 'none';
      video.style.display = 'block';
      captureButton.style.display = 'block';
      retakeButton.style.display = 'none';
      commentSection.style.display = 'none';

      setStatus('Ambil gambar apabila anda bersedia. Kasi pose paling gempak');
    }

    function sendPhoto() {
      if (!photoData || waitingForUpload) return;

      if (!window.opener || window.opener.closed) {
        setStatus('Page utama tidak ditemui. Buka kamera melalui page utama gallery.');
        return;
      }

      waitingForUpload = true;
      sendButton.disabled = true;
      setStatus('Tengah send gambar, sabo jap bey...');

      window.opener.postMessage({
        type: 'QR_GALLERY_UPLOAD',
        senderName: senderName,
        dataUrl: photoData,
        comment: commentInput.value.trim()
      }, '*');
    }

    window.addEventListener('message', function(event) {
      if (event.source !== window.opener || !event.data) return;

      if (event.data.type === 'QR_GALLERY_RESULT') {
        waitingForUpload = false;
        sendButton.disabled = false;

        if (event.data.success) {
          photoData = null;
          commentInput.value = '';
          commentSection.style.display = 'none';
          retakeButton.style.display = 'none';
          preview.style.display = 'none';
          video.style.display = 'block';
          captureButton.style.display = 'block';

          setStatus('Gambar berjaya dihantar! Moleknya komee, boleh mengambil gambar seterusnya.');
        } else {
          setStatus(event.data.message || 'Gambar tidak berjaya dihantar. Cuba lagi.');
        }
      }
    });

    window.addEventListener('pagehide', function() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

    // Cuba buka kamera apabila halaman dibuka.
    // Jika pelayar memerlukan sentuhan pengguna, tekan Buka Kamera.
    startCamera();
  </script>
</body>
</html>
