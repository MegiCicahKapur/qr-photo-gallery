<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Moment</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px;
    }

    .logo {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: #64748b;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 8px 0;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 22px;
    }

    .camera-box {
      position: relative;
      overflow: hidden;
      background: #111827;
      border-radius: 22px;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, #preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cermin (mirror) hanya untuk kamera depan. Kamera belakang kekal normal. */
    #video.mirrored {
      transform: scaleX(-1);
    }

    /* Gambar siap + frame ditunjuk penuh (tidak dipotong). */
    #preview {
      display: none;
      object-fit: contain;
      background: #fffaf1;
    }

    #cameraMessage {
      position: absolute;
      color: white;
      padding: 22px;
      text-align: center;
      line-height: 1.5;
    }

    /* Lapisan kesan live (tint, vignette, grain) di atas video. */
    .fx-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; display: none; }
    .fx-layer > div { position: absolute; inset: 0; }
    #fxGrain { mix-blend-mode: overlay; background-size: 128px 128px; opacity: 0; }

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 18px 0;
  padding: 0 12px;
}

.icon-button {
  width: 56px;
  height: 56px;
  padding: 0;
  flex: 0 0 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: #1e3a8a;
  border-radius: 50%;
}

.icon-button svg {
  width: 27px;
  height: 27px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.capture {
  width: 70px;
  height: 70px;
  flex: 0 0 70px;
  border: 5px solid white;
  border-radius: 50%;
  background: #1e3a8a;
  box-shadow: 0 0 0 2px #1e3a8a;
  padding: 0;
}

    button {
      border: 0;
      border-radius: 15px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #1e3a8a;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #e5e7eb;
      color: #172033;
    }

    textarea {
      width: 100%;
      min-height: 82px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 13px;
      font: inherit;
      margin-bottom: 14px;
    }

    #commentSection, #retakeButton {
      display: none;
    }

    #status {
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
      margin-top: 14px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* Senarai filter (dijana oleh JavaScript daripada objek FILTERS). */
    .filter-panel { margin: 14px 0 8px; }
    .filter-heading { font-size: 13px; font-weight: 700; color: #64748b; margin: 0 0 9px; }
    .filter-list { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
    .filter-option { flex: 0 0 76px; border: 2px solid transparent; border-radius: 13px; background: #fff; padding: 5px; color: #334155; font-size: 11px; font-weight: 600; text-align: center; }
    .filter-option.active { border-color: #1e3a8a; background: #eff6ff; }
    .filter-thumb { height: 55px; border-radius: 8px; margin-bottom: 5px; position: relative; overflow: hidden; }
    .thumb-base { position: absolute; inset: 0; background: linear-gradient(135deg,#f7c873,#df6b5b 48%,#167d88); }
    .thumb-fx { position: absolute; inset: 0; }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">BANDANA CAM</div>

    <h1>Photo Moment 📸</h1>
    <p class="subtitle" id="welcome">Sediakan kamera anda.</p>

    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <img id="preview" alt="Gambar yang diambil">
      <div class="fx-layer" id="fxLayer" aria-hidden="true">
        <div id="fxTint"></div>
        <div id="fxVignette"></div>
        <div id="fxGrain"></div>
      </div>
      <div id="cameraMessage">
        Kamera akan ada kat sini.
      </div>
    </div>

    <section class="filter-panel" aria-label="Pilihan filter">
      <p class="filter-heading">PILIH FILTER · SWIPE · TEKAN SEMULA UNTUK BATAL</p>
      <div class="filter-list" id="filterList"></div>
    </section>

<div class="controls">
  <!-- Gallery: empat petak kecil -->
  <button id="galleryButton"
    class="icon-button"
    type="button"
    aria-label="Lihat Gallery"
    onclick="openGallery()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>

  <!-- Butang kamera utama -->
  <button id="captureButton"
    class="capture"
    type="button"
    aria-label="Ambil gambar"
    onclick="capturePhoto()">
  </button>

  <!-- Tukar kamera: simbol refresh -->
  <button id="switchCameraButton"
    class="icon-button"
    type="button"
    aria-label="Tukar kamera depan atau belakang"
    onclick="switchCamera()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 7v5h-5"/>
      <path d="M4 17v-5h5"/>
      <path d="M5.6 9A7 7 0 0 1 18 6.5L20 12"/>
      <path d="M18.4 15A7 7 0 0 1 6 17.5L4 12"/>
    </svg>
  </button>
</div>

    <button id="startButton" class="primary" onclick="startCamera()">
      Buka Kamera
    </button>

    <button id="retakeButton" class="secondary primary"
      onclick="retakePhoto()">
      Retake
    </button>

    <section id="commentSection">
      <p><strong>Komen la sikit..</strong></p>
      <textarea id="comment"
        maxlength="160"
        placeholder="Tulis sesuatu tentang gambar ini..."></textarea>

      <button id="sendButton" class="primary" onclick="sendPhoto()">
        ➤ Hantar 
      </button>
    </section>

    <p id="status" role="status">Tengah loading sat...</p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const senderName = (params.get('name') || '').trim();

    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const cameraMessage = document.getElementById('cameraMessage');
    const captureButton = document.getElementById('captureButton');
    const startButton = document.getElementById('startButton');
    const retakeButton = document.getElementById('retakeButton');
    const commentSection = document.getElementById('commentSection');
    const commentInput = document.getElementById('comment');
    const sendButton = document.getElementById('sendButton');
    const statusBox = document.getElementById('status');
    const fxLayer = document.getElementById('fxLayer');
    const fxTint = document.getElementById('fxTint');
    const fxVignette = document.getElementById('fxVignette');
    const fxGrain = document.getElementById('fxGrain');

    let stream = null;
    let photoData = null;
    let waitingForUpload = false;
    let currentCamera = 'environment';
    let isMirrored = false;

    // true  = gambar yang disimpan sama macam preview (cermin) untuk kamera depan
    // false = gambar yang disimpan tidak dicermin (macam kamera biasa)
    const MIRROR_SAVED_FRONT_PHOTO = true;

    // Frame tropika selepas gambar diambil. Tukar ke false untuk matikan.
    const FRAME_ENABLED = true;
    const FRAME_MARGIN = 0.17; // lebar frame sebagai pecahan sisi pendek gambar

    document.getElementById('welcome').textContent =
      senderName ? 'Hai haii, ' + senderName + '!' :
      'Sila kembali dan letak nama duluu.';

    function setStatus(message) {
      statusBox.textContent = message;
    }

    /* ------------------------------------------------------------------
       FILTERS
       css      : rantai fungsi CSS filter (preview guna terus; gambar disimpan
                  guna versi matriks piksel supaya jadi di semua pelayar,
                  termasuk iPhone/Safari yang tidak sokong ctx.filter).
       tint     : warna overlay (opsyenal)
       vignette : kegelapan tepi 0-1 (opsyenal)
       grain    : kekuatan bintik filem 0-1 (opsyenal)
    ------------------------------------------------------------------ */
    const FILTERS = {
      clarendon: { label: 'Clarendon', css: 'contrast(1.22) saturate(1.2)' },
      jakarta:   { label: 'Jakarta', css: 'sepia(.2) saturate(1.18) contrast(1.08)' },
      losangeles:{ label: 'Los Angeles', css: 'sepia(.28) saturate(1.2) brightness(1.05)' },
      tokyo:     { label: 'Tokyo', css: 'hue-rotate(10deg) saturate(1.12) contrast(1.12)' },
      bloom:     { label: 'Tropical Bloom', css: 'saturate(1.35) contrast(1.04) brightness(1.03)', tint: 'rgba(255,120,150,.07)' },
      midnight:  { label: 'Midnight', css: 'brightness(.85) contrast(1.15) saturate(.8)', tint: 'rgba(20,40,120,.28)', vignette: .5 },
      rio:       { label: 'Rio de Janeiro', css: 'saturate(1.45) contrast(1.1) brightness(1.05) sepia(.1)', tint: 'rgba(255,160,40,.12)' },
      hyper:     { label: 'Hyper', css: 'saturate(1.9) contrast(1.25) brightness(1.04) hue-rotate(-4deg)', tint: 'rgba(255,0,170,.06)' },
      gritty:    { label: 'Gritty', css: 'grayscale(.5) contrast(1.4) brightness(.92)', vignette: .6, grain: .45 }
    };

    let selectedFilter = null; // null = tiada filter

    // Tile bintik (noise) untuk grain, dikongsi oleh preview dan gambar disimpan.
    const noiseTile = (function () {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const x = c.getContext('2d');
      const id = x.createImageData(size, size);
      for (let i = 0; i < id.data.length; i += 4) {
        const v = Math.random() * 255;
        id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
        id.data[i + 3] = 255;
      }
      x.putImageData(id, 0, 0);
      return c;
    })();
    fxGrain.style.backgroundImage = 'url(' + noiseTile.toDataURL() + ')';

    function buildFilterList() {
      const list = document.getElementById('filterList');
      Object.keys(FILTERS).forEach(function (key) {
        const f = FILTERS[key];
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'filter-option';
        b.dataset.filter = key;
        b.onclick = function () { selectFilter(key); };

        const thumb = document.createElement('div');
        thumb.className = 'filter-thumb';
        const base = document.createElement('div');
        base.className = 'thumb-base';
        base.style.filter = f.css;
        const fx = document.createElement('div');
        fx.className = 'thumb-fx';
        const layers = [];
        if (f.vignette) layers.push('radial-gradient(circle at center, transparent 45%, rgba(0,0,0,' + f.vignette + ') 100%)');
        if (f.tint) layers.push('linear-gradient(' + f.tint + ',' + f.tint + ')');
        fx.style.background = layers.join(',') || 'none';
        thumb.append(base, fx);

        b.append(thumb, document.createTextNode(f.label));
        list.appendChild(b);
      });
    }

    function applyLiveEffects() {
      const f = selectedFilter ? FILTERS[selectedFilter] : null;
      video.style.filter = f ? f.css : 'none';
      fxTint.style.background = f && f.tint ? f.tint : 'none';
      fxVignette.style.background = f && f.vignette
        ? 'radial-gradient(circle farthest-corner at center, transparent 55%, rgba(0,0,0,' + f.vignette + ') 100%)'
        : 'none';
      fxGrain.style.opacity = f && f.grain ? f.grain : 0;
      fxLayer.style.display = (f && video.style.display !== 'none') ? 'block' : 'none';
    }

    function selectFilter(name) {
      if (photoData) {
        setStatus('Tekan Retake dulu kalau nak tukar filter.');
        return;
      }
      selectedFilter = (selectedFilter === name) ? null : name;
      document.querySelectorAll('.filter-option').forEach(function (b) {
        b.classList.toggle('active', b.dataset.filter === selectedFilter);
      });
      applyLiveEffects();
      setStatus(selectedFilter
        ? 'Filter ' + FILTERS[selectedFilter].label + ' dipilih.'
        : 'Filter dibatalkan.');
    }

    /* ------------------------------------------------------------------
       Terapkan rantai CSS filter pada piksel canvas (tanpa ctx.filter).
       Semua fungsi (brightness, contrast, saturate, sepia, grayscale,
       hue-rotate) digabungkan menjadi satu matriks 3x3 + offset.
    ------------------------------------------------------------------ */
    function applyCssFilterToCanvas(ctx, w, h, css) {
      if (!css || css === 'none') return;

      let M = [1, 0, 0, 0, 1, 0, 0, 0, 1];
      let o = [0, 0, 0];
      const compose = function (A, b) {
        const N = new Array(9), n = new Array(3);
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            N[r * 3 + c] = A[r * 3] * M[c] + A[r * 3 + 1] * M[3 + c] + A[r * 3 + 2] * M[6 + c];
          }
          n[r] = A[r * 3] * o[0] + A[r * 3 + 1] * o[1] + A[r * 3 + 2] * o[2] + b[r];
        }
        M = N; o = n;
      };

      const re = /([a-z-]+)\(\s*(-?[\d.]+)(deg|%)?\s*\)/g;
      let mt;
      while ((mt = re.exec(css))) {
        const name = mt[1];
        let v = parseFloat(mt[2]);
        if (mt[3] === '%') v /= 100;
        const Z = [0, 0, 0];

        if (name === 'brightness') {
          compose([v, 0, 0, 0, v, 0, 0, 0, v], Z);
        } else if (name === 'contrast') {
          const k = 127.5 * (1 - v);
          compose([v, 0, 0, 0, v, 0, 0, 0, v], [k, k, k]);
        } else if (name === 'saturate') {
          compose([
            .213 + .787 * v, .715 - .715 * v, .072 - .072 * v,
            .213 - .213 * v, .715 + .285 * v, .072 - .072 * v,
            .213 - .213 * v, .715 - .715 * v, .072 + .928 * v
          ], Z);
        } else if (name === 'grayscale') {
          const s = 1 - Math.min(1, v);
          compose([
            .2126 + .7874 * s, .7152 - .7152 * s, .0722 - .0722 * s,
            .2126 - .2126 * s, .7152 + .2848 * s, .0722 - .0722 * s,
            .2126 - .2126 * s, .7152 - .7152 * s, .0722 + .9278 * s
          ], Z);
        } else if (name === 'sepia') {
          const s = 1 - Math.min(1, v);
          compose([
            .393 + .607 * s, .769 - .769 * s, .189 - .189 * s,
            .349 - .349 * s, .686 + .314 * s, .168 - .168 * s,
            .272 - .272 * s, .534 - .534 * s, .131 + .869 * s
          ], Z);
        } else if (name === 'hue-rotate') {
          const a = v * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
          compose([
            .213 + cs * .787 - sn * .213, .715 - cs * .715 - sn * .715, .072 - cs * .072 + sn * .928,
            .213 - cs * .213 + sn * .143, .715 + cs * .285 + sn * .140, .072 - cs * .072 - sn * .283,
            .213 - cs * .213 - sn * .787, .715 - cs * .715 + sn * .715, .072 + cs * .928 + sn * .072
          ], Z);
        }
      }

      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      const m0 = M[0], m1 = M[1], m2 = M[2], m3 = M[3], m4 = M[4], m5 = M[5], m6 = M[6], m7 = M[7], m8 = M[8];
      const o0 = o[0], o1 = o[1], o2 = o[2];
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        d[i]     = m0 * r + m1 * g + m2 * b + o0;
        d[i + 1] = m3 * r + m4 * g + m5 * b + o1;
        d[i + 2] = m6 * r + m7 * g + m8 * b + o2;
      }
      ctx.putImageData(img, 0, 0);
    }

    // Filter penuh pada gambar disimpan: warna -> tint -> vignette -> grain.
    function applyFilterEffects(ctx, w, h, f) {
      applyCssFilterToCanvas(ctx, w, h, f.css);

      if (f.tint) {
        ctx.fillStyle = f.tint;
        ctx.fillRect(0, 0, w, h);
      }

      if (f.vignette) {
        const r = Math.hypot(w, h) / 2;
        const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, r);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(.55, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,' + f.vignette + ')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }

      if (f.grain) {
        const boxW = document.querySelector('.camera-box').clientWidth || 400;
        const k = w / boxW; // samakan saiz bintik dengan preview
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = f.grain;
        ctx.scale(k, k);
        ctx.fillStyle = ctx.createPattern(noiseTile, 'repeat');
        ctx.fillRect(0, 0, w / k, h / k);
        ctx.restore();
      }
    }

    /* ------------------------------------------------------------------
       FRAME TROPIKA (dilukis dengan canvas, ikut rujukan gambar)
    ------------------------------------------------------------------ */
    function drawLeaf(ctx, x, y, angle, len, wid, c1, c2) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      const g = ctx.createLinearGradient(0, 0, 0, -len);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(wid, -len * .2, wid * 1.05, -len * .75, 0, -len);
      ctx.bezierCurveTo(-wid * 1.05, -len * .75, -wid, -len * .2, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,225,170,.5)';
      ctx.lineWidth = Math.max(1, len * .012);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -len * .95);
      for (let i = 1; i <= 5; i++) {
        const t = i / 6.5, yy = -len * t;
        const w = wid * .75 * (1 - Math.abs(t - .4) * .9);
        ctx.moveTo(0, yy); ctx.lineTo(w, yy - len * .12);
        ctx.moveTo(0, yy); ctx.lineTo(-w, yy - len * .12);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawPalm(ctx, x, y, angle, len, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(1.5, len * .012);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -len);
      ctx.stroke();
      const n = 22;
      for (let i = 1; i <= n; i++) {
        const t = i / (n + 1), yy = -len * t;
        const l = len * .28 * (1 - Math.abs(t - .45) * 1.1);
        ctx.lineWidth = Math.max(1, len * .01);
        ctx.beginPath();
        ctx.moveTo(0, yy); ctx.lineTo(l * .9, yy - l * .55);
        ctx.moveTo(0, yy); ctx.lineTo(-l * .9, yy - l * .55);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawHibiscus(ctx, x, y, r, outer, inner, rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      for (let i = 0; i < 5; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI * 2 / 5);
        const g = ctx.createRadialGradient(0, 0, r * .05, 0, 0, r);
        g.addColorStop(0, inner);
        g.addColorStop(.5, outer);
        g.addColorStop(1, outer);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-r * .75, -r * .2, -r * .8, -r * .98, 0, -r * .98);
        ctx.bezierCurveTo(r * .8, -r * .98, r * .75, -r * .2, 0, 0);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.10)';
        ctx.lineWidth = Math.max(1, r * .015);
        ctx.stroke();
        ctx.restore();
      }
      ctx.strokeStyle = '#f2c14e';
      ctx.lineWidth = Math.max(2, r * .05);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(r * .2, -r * .7);
      ctx.stroke();
      ctx.fillStyle = '#f6a21e';
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(r * .2 + Math.cos(i * 1.3) * r * .07, -r * .7 + Math.sin(i * 1.3) * r * .07, r * .04, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Satu sudut: asal (0,0) ialah penjuru canvas, hiasan meluas ke +x / +y.
    function drawCorner(ctx, s, flower) {
      drawPalm(ctx, s * .08, s * .12, 105, s * .95, '#cfae5a');
      drawPalm(ctx, s * .12, s * .06, 155, s * .92, '#1f7d70');
      drawLeaf(ctx, s * .22, s * .12, 120, s * .82, s * .28, '#14574f', '#2a8f80');
      drawLeaf(ctx, s * .10, s * .26, 150, s * .72, s * .24, '#1b6d63', '#33a08e');
      drawHibiscus(ctx, s * .40, s * .40, s * .30, flower.outer, flower.inner, flower.rot);
    }

    function addTropicalFrame(photo) {
      const pw = photo.width, ph = photo.height;
      const m = Math.round(Math.min(pw, ph) * FRAME_MARGIN);
      const W = pw + 2 * m, H = ph + 2 * m;

      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#fffaf1';
      ctx.fillRect(0, 0, W, H);
      ctx.drawImage(photo, m, m);

      // Garisan emas berganda
      const gold = ctx.createLinearGradient(0, 0, W, H);
      gold.addColorStop(0, '#f3d27a');
      gold.addColorStop(.5, '#c8912b');
      gold.addColorStop(1, '#f3d27a');
      ctx.strokeStyle = gold;
      const lw = Math.max(3, m * .03);
      ctx.lineWidth = lw * 1.4;
      ctx.strokeRect(m - m * .05, m - m * .05, pw + m * .1, ph + m * .1);
      ctx.lineWidth = lw * .7;
      ctx.strokeRect(m - m * .14, m - m * .14, pw + m * .28, ph + m * .28);

      // Empat sudut hiasan (merah di kiri, oren di kanan)
      const RED = { outer: '#e9584a', inner: '#8c1d3b', rot: .3 };
      const ORANGE = { outer: '#fb9b2a', inner: '#9a2b5a', rot: 1.1 };
      const s = m * 1.75;
      [
        { tx: 0, ty: 0, sx: 1,  sy: 1,  flower: RED },
        { tx: W, ty: 0, sx: -1, sy: 1,  flower: ORANGE },
        { tx: 0, ty: H, sx: 1,  sy: -1, flower: RED },
        { tx: W, ty: H, sx: -1, sy: -1, flower: ORANGE }
      ].forEach(function (k) {
        ctx.save();
        ctx.translate(k.tx, k.ty);
        ctx.scale(k.sx, k.sy);
        drawCorner(ctx, s, k.flower);
        ctx.restore();
      });

      return c;
    }

    /* ------------------------------------------------------------------
       KAMERA
    ------------------------------------------------------------------ */
    async function startCamera() {
      if (!senderName) {
        setStatus('Nama tidak ditemui. Sila buka semula melalui halaman utama.');
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setStatus('Kamera tidak disokong di sini. Buka pautan menggunakan pelayar yang terkini.');
        return;
      }

      startButton.disabled = true;
      setStatus('Tengah akses kamera jap...');

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: currentCamera },
            width: { ideal: 1600 },
            height: { ideal: 1200 }
          }
        });

        video.srcObject = stream;
        await video.play();

        // Kesan kamera sebenar yang dibuka (bukan sekadar yang diminta).
        // Webcam laptop biasanya tiada facingMode, jadi dianggap kamera depan.
        const settings = stream.getVideoTracks()[0].getSettings();
        isMirrored = settings.facingMode
          ? settings.facingMode === 'user'
          : true;
        video.classList.toggle('mirrored', isMirrored);

        video.style.display = 'block';
        preview.style.display = 'none';
        cameraMessage.style.display = 'none';
        captureButton.style.display = 'block';
        startButton.style.display = 'none';
        document.getElementById('switchCameraButton').style.display = 'inline-block';
        applyLiveEffects();

        setStatus('Kamera readyy. Tekan bulat tu untuk bergambar, senyumm.');
      } catch (error) {
        startButton.disabled = false;
        startButton.style.display = 'block';
        cameraMessage.style.display = 'block';

        if (error.name === 'NotAllowedError') {
          cameraMessage.textContent =
            'Kebenaran kamera tidak diberikan. Cuba cek permission dekat website setting.';
          setStatus('Sila bagi akses kamera jika pop-up kebenaran dipaparkan.');
        } else {
          cameraMessage.textContent =
            'Kamera takleh dibuka. Cuba tekan Buka Kamera.';
          setStatus('Ralat kamera: ' + error.name);
        }
      }
    }

    async function switchCamera() {
      if (waitingForUpload || photoData) return;

      const nextCamera =
        currentCamera === 'environment' ? 'user' : 'environment';

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      currentCamera = nextCamera;

      await startCamera();
    }

    function openGallery() {
      const galleryUrl =
        'https://script.google.com/macros/s/AKfycbxy88O1sg0RndiNZsyEmrQ-IFzeqljy98huI0R88eBd4CiOlVcqgSBGoaLiwM_Zp4fu/exec?page=gallery';

      window.open(galleryUrl, '_blank');
    }

    function capturePhoto() {
      if (!video.videoWidth || !stream) {
        setStatus('Tunggu sampai kamera ready.');
        return;
      }

      // Jumlah lebar akhir (termasuk frame) dihadkan ~1600px.
      const margin = FRAME_ENABLED ? FRAME_MARGIN : 0;
      const maxPhotoW = Math.floor(1600 / (1 + 2 * margin));
      const scale = Math.min(1, maxPhotoW / video.videoWidth);
      const pw = Math.round(video.videoWidth * scale);
      const ph = Math.round(video.videoHeight * scale);

      // 1) Lukis gambar kamera (cermin hanya untuk kamera depan)
      const photo = document.createElement('canvas');
      photo.width = pw;
      photo.height = ph;
      const pctx = photo.getContext('2d');
      pctx.save();
      if (isMirrored && MIRROR_SAVED_FRONT_PHOTO) {
        pctx.translate(pw, 0);
        pctx.scale(-1, 1);
      }
      pctx.drawImage(video, 0, 0, pw, ph);
      pctx.restore();

      // 2) Filter (kiraan piksel, jadi di semua pelayar)
      if (selectedFilter) applyFilterEffects(pctx, pw, ph, FILTERS[selectedFilter]);

      // 3) Frame tropika
      const out = FRAME_ENABLED ? addTropicalFrame(photo) : photo;

      photoData = out.toDataURL('image/jpeg', 0.85);

      preview.src = photoData;
      preview.style.display = 'block';
      video.style.display = 'none';
      applyLiveEffects();
      captureButton.style.display = 'none';
      retakeButton.style.display = 'block';
      commentSection.style.display = 'block';
      commentInput.value = '';

      setStatus('Gambar sudah diambil. Komen la sikett, kemudian hantar.');
    }

    function retakePhoto() {
      if (waitingForUpload) return;

      photoData = null;
      preview.style.display = 'none';
      video.style.display = 'block';
      applyLiveEffects();
      captureButton.style.display = 'block';
      retakeButton.style.display = 'none';
      commentSection.style.display = 'none';

      setStatus('Ambil gambar apabila anda bersedia. Kasi pose paling gempak');
    }

    function sendPhoto() {
      if (!photoData || waitingForUpload) return;

      if (!window.opener || window.opener.closed) {
        setStatus('Page utama tidak ditemui. Buka kamera melalui page utama gallery.');
        return;
      }

      waitingForUpload = true;
      sendButton.disabled = true;
      setStatus('Tengah send gambar, sabo jap bey...');

      window.opener.postMessage({
        type: 'QR_GALLERY_UPLOAD',
        senderName: senderName,
        dataUrl: photoData,
        comment: commentInput.value.trim()
      }, '*');
    }

    window.addEventListener('message', function(event) {
      if (event.source !== window.opener || !event.data) return;

      if (event.data.type === 'QR_GALLERY_RESULT') {
        waitingForUpload = false;
        sendButton.disabled = false;

        if (event.data.success) {
          photoData = null;
          commentInput.value = '';
          commentSection.style.display = 'none';
          retakeButton.style.display = 'none';
          preview.style.display = 'none';
          video.style.display = 'block';
          applyLiveEffects();
          captureButton.style.display = 'block';

          setStatus('Gambar berjaya dihantar! Moleknya komee, boleh mengambil gambar seterusnya.');
        } else {
          setStatus(event.data.message || 'Gambar tidak berjaya dihantar. Cuba lagi.');
        }
      }
    });

    window.addEventListener('pagehide', function() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

    buildFilterList();

    // Cuba buka kamera apabila halaman dibuka.
    // Jika pelayar memerlukan sentuhan pengguna, tekan Buka Kamera.
    startCamera();
  </script>
